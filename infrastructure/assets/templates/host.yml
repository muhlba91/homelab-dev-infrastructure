---
# Every field, with an example value; the program test renders this file as a host.
# The file is named after the host, optionally prefixed with its deploy order: [<order>-]<name>.yml
# (0xx test systems, 1xx OVH, 2xx Hetzner, 9xx physical sites).

# required: a hostname label of at most 30 characters
name: host
# optional: default false (rendered and checked, but no keys or secrets: not deployable)
enabled: false

# optional deploy settings
deploy:
  # CI deploys the host after every `pulumi up` on main (only an enabled host); off: by hand only (./host deploy)
  automated: false

# required hardware settings
hardware:
  # a file in nix/hardware/: qemu (any x86_64 VM, BIOS or UEFI; the OS disk plus the data disk labelled `data`)
  profile: qemu
  # the OS disk (wiped by every install): with the data disk attached, its stable path, never /dev/sdX
  disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi0

# optional system settings (the values shown are the defaults)
system:
  # 0s = off; needs a watchdog device (Proxmox q35: built in; none, e.g. a cloud VM: 0s)
  watchdog: 60s
  gc:
    # garbage-collect generations older than this, keeping at least `keep`
    olderThan: 7d
    keep: 3

# required network settings: one NIC on the site LAN, static addresses
network:
  domain: site.internal.example
  # the NIC is renamed by its MAC: a wrong MAC locks the host out
  mac: "bc:24:11:00:00:00"
  interface: lan0
  v4:
    address: 10.46.0.10
    netmask: 16
    gateway: 10.46.0.1
  # optional: a static IPv6 address; the default route and DNS come from router advertisements (acceptRA, default
  # true; never an address) and/or the gateway (needed with acceptRA: false)
  v6:
    address: "fd46::10"
    netmask: 64
    gateway: "fd46::1"
    acceptRA: true
  # optional: default: the IPv4 gateway (the site router's DNS)
  nameservers:
    - 10.46.0.1
  # optional: default: the IPv4 address
  # managementAddress: 10.46.0.10
  # optional: who may reach SSH, Coder and docker.trustedPorts; default 10.0.0.0/8, fc00::/7, 2001:678:dc0::/48
  trustedNetworks:
    v4:
      - 10.0.0.0/8
    v6:
      - "fc00::/7"
      - "2001:678:dc0::/48"

# required user settings: the human user (home on /data, the GitHub machine key, no sudo); SSH keys: assets/ssh/*.pub
user:
  name: user
  # 1000-59999, pinned: files on /data keep their owner across reinstalls
  uid: 1000
  git:
    name: User Name
    email: user@example.org
  # optional: https URL of a chezmoi repository applied to the home daily (a user timer); default none
  dotfiles: https://github.com/example/dotfiles.git

# optional Docker settings: a rootless Docker daemon for the user (a systemd user unit; nobody is in the docker
# group); published ports bind to 127.0.0.1 by default
docker:
  enabled: false
  # optional: TCP ports/ranges opened to the trusted networks, for containers published on the host's address
  # (`-p 0.0.0.0:8080:80`); default none
  trustedPorts:
    - "8000-8999"

# optional Coder settings: Coder runs as the user, workspaces are directories in ~/workspaces
coder:
  # an enabled Coder gets a generated admin password (secrets/coder-admin-password) and nightly database backups
  # (restic to the backup bucket, dev/<host>/coder/; secrets/restic-password, secrets/restic-s3)
  enabled: false
  # optional: default http://<mgmt address>:3000; an https URL means a TLS-terminating proxy in front
  accessUrl: https://coder.example.org
  # optional: hostname pattern for workspace apps; default none (path-based apps)
  wildcardAccessUrl: "*.coder.example.org"
  # optional: login with the OIDC provider of the stack config `zitadel` (needs an https accessUrl); default
  # false; the host gets secrets/coder-oidc
  oidc: true

# optional Vault Agent settings: logs in with the AppRole role dev-infrastructure-<name> (created by
# github-infrastructure: the repository's accessPermissions.vault.appRoles) and keeps a short-lived token for the user
# (`vault`, fnox and Pulumi find it); an enabled agent gets secrets/vault-role-id and secrets/vault-secret-id
vault:
  enabled: false
  # required when enabled
  address: https://vault.example.org
