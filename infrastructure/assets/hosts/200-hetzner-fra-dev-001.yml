---
# required host settings
name: hetzner-fra-dev-001
enabled: true

# optional deploy settings
deploy:
  # true once the host is installed (./host install): CI cannot deploy before
  automated: false

# required hardware settings
hardware:
  profile: qemu
  disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi0

# required network settings
network:
  domain: fra.hetzner.internal.muehlbachler.io
  mac: "bc:24:11:25:ab:8e"
  interface: lan0
  v4:
    address: 10.100.60.1
    netmask: 16
    gateway: 10.100.0.1
  v6:
    address: "2a01:4f8:121:14e2:100::60:1"
    netmask: 80
  trustedNetworks:
    v4:
      - 10.0.0.0/8
    v6:
      - "fc00::/7"
      - "2001:678:dc0::/48"

# required user settings
user:
  name: daniel
  uid: 1000
  git:
    name: Daniel Muehlbachler-Pietrzykowski
    email: daniel@muehlbachler.io

# optional Coder settings
coder:
  enabled: false
