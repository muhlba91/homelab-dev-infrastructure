---
# The Coder spike (docs/spike.md): a throw-away VM with the full user setup (pinned uid, home on the data disk,
# linger, subuid ranges) and Coder as the user. Deleted (file and VM) once the spike is done.
name: hetzner-fra-dev-000
# the throw-away VM exists: enabled
enabled: true

# required hardware settings
hardware:
  profile: qemu
  disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi0

# required network settings
network:
  domain: fra.hetzner.internal.muehlbachler.io
  # set when the VM is created
  mac: "bc:24:11:20:36:c1"
  interface: lan0
  v4:
    address: 10.100.60.2
    netmask: 16
    gateway: 10.100.0.1

# required user settings
user:
  name: daniel
  uid: 1000
  git:
    name: Daniel Muehlbachler-Pietrzykowski
    email: daniel@muehlbachler.io

# optional Coder settings
coder:
  enabled: true
